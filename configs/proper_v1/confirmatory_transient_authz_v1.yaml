primary_endpoint:
  name: recovery_validity
  hypothesis_direction: paired_positive_transfer_greater_than_paired_negative_transfer
  test: exact_two_sided_mcnemar
  alpha: 0.05
  support_rule: ppt_greater_than_pnt_and_p_value_below_alpha
  paired_risk_difference_ci: paired_wald_normal_clipped
  confidence_level: 0.95

secondary_endpoints:
  - task_completion
  - memory_induced_action_change
  - exact_retry
  - safety_violation
  - repeated_invalid_calls
  - all_valid_target_recovery_validity
  - tool_stratified_recovery_validity
  - selected_memory_concentration

boundary:
  model_output_holdout_not_unseen_input_claim: true
  selector_hidden_labels_forbidden: true
  persistent_authorization_generalization_forbidden: true
  capacity_result_used_before_model_outputs_only: true
  no_refit: true
  no_threshold_tuning: true

outputs:
  prepared_manifest: work/confirmatory_transient_authz_v1_prepared.json
  screening_output: outputs/confirmatory_transient_authz_v1/screening.json
  result_output: outputs/confirmatory_transient_authz_v1/results.json
  schema: schemas/confirmatory_transient_authz_v1.schema.json
  never_overwrite:
    - outputs/confirmatory_gate_v1/results.json
    - outputs/transient_authz_capacity_v1/screening.json

stop_rules:
  capacity_hash_mismatch: stop
  public_test_hash_mismatch: stop
  memory_bank_hash_mismatch: stop
  project_manifest_mismatch: stop
  source_target_overlap: stop
  primary_pair_count_not_53: stop
  hidden_field_in_prompt_or_selector: stop
  persistent_authorization_in_cohort: stop
  any_refit_after_capacity_result: forbidden
