conditions:
  fixed_order:
    - tfidf_rank1_memory
    - proper_v2_memory
  primary_comparison: proper_v2_memory_vs_tfidf_rank1_memory
  identical_prompt_reuse_permitted: true
  full_prompt_and_model_output_required: true

model:
  name: Qwen3-8B
  backend: transformers
  manifest: configs/proper_v1/qwen3_8b_model.sha256
